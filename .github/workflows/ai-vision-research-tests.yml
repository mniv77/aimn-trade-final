name: AI Vision research offline checks

on:
  push:
    branches:
      - research/ai-vision-independent-v1
  pull_request:
    paths:
      - 'kiss/ai_vision_independent.py'
      - 'tests/test_ai_vision_independent.py'
      - 'kiss/ai_vision_major_trend_research.py'
      - 'tests/test_ai_vision_major_trend.py'
      - 'kiss/ai_vision_major_trend_pilot.py'
      - 'tests/test_ai_vision_major_trend_pilot.py'
      - 'kiss/ai_vision_offline_structure.py'
      - 'tests/test_ai_vision_offline_structure.py'
      - 'kiss/ai_vision_offline_five.py'
      - 'kiss/ai_vision_horizon_comparison.py'
      - 'templates/aimn_visual_lab.html'
      - 'kiss/exp70_st_plateau_early_reversal.py'
      - 'kiss/exp71_noise_exit_audit.py'
      - 'tests/test_ai_vision_horizon_comparison.py'
      - '.github/workflows/ai-vision-research-tests.yml'

jobs:
  causal-backtest-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run independent research tests
        run: python -m unittest discover -s tests -p 'test_ai_vision*.py' -v

      - name: Dry-run five historical NVDA assessments without API calls
        run: python -m kiss.ai_vision_major_trend_pilot --dry-run --samples 5

      - name: Run zero-cost NVDA major/local trend baseline
        run: python -m kiss.ai_vision_offline_five

      - name: Compare five major-trend horizons on NVDA
        run: python -m kiss.ai_vision_horizon_comparison

      - name: Validate Visual Lab inline JavaScript syntax and research controls
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class Extractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.ids = set()
                  self.inside_script = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.add(attrs['id'])
                  if tag == 'script':
                      self.inside_script = not bool(attrs.get('src'))
              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.inside_script = False
              def handle_data(self, data):
                  if self.inside_script:
                      self.scripts.append(data)

          page = Path('templates/aimn_visual_lab.html').read_text(encoding='utf-8')
          parser = Extractor()
          parser.feed(page)
          required = {
              'majorTrendToggle', 'majorTrendHorizon', 'majorTrendSummary',
              'blindFreeze', 'blindReveal', 'blindFeedback', 'blindSaveReview',
              'blindExportReviews', 'blindPrediction', 'blindChart',
          }
          missing = required - parser.ids
          assert not missing, f'Missing Visual Lab controls: {sorted(missing)}'
          with tempfile.NamedTemporaryFile(mode='w', suffix='.js', encoding='utf-8') as js:
              js.write('\n'.join(parser.scripts))
              js.flush()
              subprocess.run(['node', '--check', js.name], check=True)
          print('Visual Lab inline JavaScript syntax and required controls: OK')
          PY

      - name: Install EXP70 research dependency
        run: python -m pip install pandas

      - name: Run EXP70 conventional ST versus early plateau tactic
        run: python -m kiss.exp70_st_plateau_early_reversal --output /tmp/exp70_st_plateau_comparison.json

      - name: Run EXP71 noise exit event audit
        run: python -m kiss.exp71_noise_exit_audit --output /tmp/exp71_noise_exit_event_audit.json
