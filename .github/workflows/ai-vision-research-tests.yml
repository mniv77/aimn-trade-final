name: AI Vision research offline checks

on:
  push:
    branches:
      - research/ai-vision-independent-v1
  pull_request:
    paths:
      - 'kiss/ai_vision_independent.py'
      - 'tests/test_ai_vision_independent.py'
      - 'kiss/ai_vision_major_trend_research.py'
      - 'tests/test_ai_vision_major_trend.py'
      - 'kiss/ai_vision_major_trend_pilot.py'
      - 'tests/test_ai_vision_major_trend_pilot.py'
      - 'kiss/ai_vision_offline_structure.py'
      - 'tests/test_ai_vision_offline_structure.py'
      - 'kiss/ai_vision_offline_five.py'
      - 'kiss/ai_vision_horizon_comparison.py'
      - 'tests/test_ai_vision_horizon_comparison.py'
      - '.github/workflows/ai-vision-research-tests.yml'

jobs:
  causal-backtest-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run independent research tests
        run: python -m unittest discover -s tests -p 'test_ai_vision*.py' -v

      - name: Dry-run five historical NVDA assessments without API calls
        run: python -m kiss.ai_vision_major_trend_pilot --dry-run --samples 5

      - name: Run zero-cost NVDA major/local trend baseline
        run: python -m kiss.ai_vision_offline_five

      - name: Compare five major-trend horizons on NVDA
        run: python -m kiss.ai_vision_horizon_comparison
