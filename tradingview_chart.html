        // 1. Candlestick Chart Setup
        const chartElement = document.getElementById('chartPane');
        const chart = LightweightCharts.createChart(chartElement, {
            layout: { background: { type: 'solid', color: '#1e222d' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            timeScale: { borderColor: '#485158', timeVisible: true, secondsVisible: false },
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350',
            borderVisible: true, borderUpColor: '#26a69a', borderDownColor: '#ef5350',
            wickUpColor: '#26a69a', wickDownColor: '#ef5350',
        });

        const volumeSeries = chart.addHistogramSeries({
            color: '#26a69a',
            priceFormat: { type: 'volume' },
            priceScaleId: '',
        });
        chart.priceScale('').applyOptions({ scaleMargins: { top: 0.75, bottom: 0 } });

        // 2. RSI Chart Setup
        const rsiElement = document.getElementById('rsiPane');
        const rsiChart = LightweightCharts.createChart(rsiElement, {
            layout: { background: { type: 'solid', color: '#1e222d' }, textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
            timeScale: { borderColor: '#485158', timeVisible: true, secondsVisible: false },
        });

        const lineSeries = rsiChart.addLineSeries({ color: '#2962FF', lineWidth: 2 });
        const entryLine = rsiChart.addLineSeries({
            color: '#ff9800', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed,
        });

        function loadTimeframe(tf) {
            const dataset = allData[tf] || allData["5m"];
            candlestickSeries.setData(dataset.candles);
            volumeSeries.setData(dataset.volume);
            lineSeries.setData(dataset.rsi);
            entryLine.setData(dataset.rsi.map(item => ({ time: item.time, value: 40.0 })));
            
            document.getElementById('chartTitle').innerText = "BTCUSDT • " + tf.toUpperCase() + " Strategy Chart";
            chart.timeScale().fitContent();
            rsiChart.timeScale().fitContent();
        }

        // Initialize with 5m by default
        loadTimeframe("5m");

        // Button click listeners
        document.querySelectorAll('.tf-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                loadTimeframe(e.target.getAttribute('data-tf'));
            });
        });

        // Sync timescales
        let lock = false;
        chart.timeScale().subscribeVisibleTimeRangeChange(timeRange => {
            if (lock || !timeRange) return;
            lock = true;
            rsiChart.timeScale().setVisibleRange(timeRange);
            lock = false;
        });

        rsiChart.timeScale().subscribeVisibleTimeRangeChange(timeRange => {
            if (lock || !timeRange) return;
            lock = true;
            chart.timeScale().setVisibleRange(timeRange);
            lock = false;
        });

        window.addEventListener('resize', () => {
            chart.resize(chartElement.clientWidth, 520);
            rsiChart.resize(rsiElement.clientWidth, 220);
        });
