<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trade Review Chart</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background: #0b0e11; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        h2 { margin: 0; color: #00ffcc; font-size: 18px; }
        .controls { display: flex; align-items: center; gap: 10px; font-size: 13px; }
        select { background: #20242d; color: #fff; border: 1px solid #2a2e39; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        select:focus { outline: none; border-color: #00ffcc; }
        #chart-container { width: 100%; height: 600px; background: #131722; border-radius: 8px; border: 1px solid #2a2e39; position: relative; }
        .back-btn { background: #20242d; color: #fff; border: 1px solid #2a2e39; padding: 6px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 12px; }
        .back-btn:hover { background: #2a2e39; }
        .filter-btn { background: #20242d; color: #d1d4dc; border: 1px solid #2a2e39; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .filter-btn:hover, .filter-btn.active { background: #00ffcc; color: #0b0e11; border-color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="header-left">
            <h2>Trade Review: <span id="symbol-title">Loading...</span></h2>
            <div class="controls">
                <label for="trade-select">Select Trade:</label>
                <select id="trade-select"></select>
                <div class="filter-btns" style="display:inline-flex; gap:5px; margin-left:10px;">
                    <button class="filter-btn active" onclick="setFilter('all', event)">All</button>
                    <button class="filter-btn" onclick="setFilter('losses', event)">Losses</button>
                    <button class="filter-btn" onclick="setFilter('small_gainers', event)">Small Gainers</button>
                    <button class="filter-btn" onclick="setFilter('winners', event)">Winners</button>
                </div>
            </div>
        </div>
        <a href="/auto_tuner" class="back-btn">Back to Tuner</a>
    </div>
    <div id="chart-container"></div>
        <script>
        let chart;
        let candlestickSeries;
        let volumeSeries;
        let allTrades = [];
        let currentFilter = 'all';
        let currentTradeId = window.location.pathname.split('/').pop() || '1';

        document.addEventListener("DOMContentLoaded", () => {
            initChart();
            loadTradeList();

            const select = document.getElementById("trade-select");
            select.addEventListener("change", (e) => {
                const selectedId = e.target.value;
                if (selectedId) {
                    window.history.pushState({}, '', `/trade_chart_view/${selectedId}`);
                    currentTradeId = selectedId;
                    loadTradeData(selectedId);
                }
            });
        });

        function initChart() {
            const container = document.getElementById("chart-container");
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: container.clientHeight,
                layout: {
                    background: { type: 'solid', color: '#0b0e11' },
                    textColor: '#d1d4dc',
                },
                grid: {
                    vertLines: { color: '#1f293d' },
                    horzLines: { color: '#1f293d' },
                },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                rightPriceScale: { borderColor: '#2a2e39' },
                timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false },
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#00ffcc',
                downColor: '#ff3366',
                borderVisible: false,
                wickUpColor: '#00ffcc',
                wickDownColor: '#ff3366',
            });

            volumeSeries = chart.addHistogramSeries({
                color: '#26a69a',
                priceFormat: { type: 'volume' },
                priceScaleId: '',
            });

            volumeSeries.priceScale().applyOptions({
                scaleMargins: { top: 0.8, bottom: 0 },
            });

            window.addEventListener('resize', () => {
                chart.resize(container.clientWidth, container.clientHeight);
            });
        }

        function setFilter(type, event) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            renderTradeDropdown();
        }

        function loadTradeList() {
            fetch("/api/trades_list")
                .then(res => res.json())
                .then(data => {
                    allTrades = data.trades || [];
                    renderTradeDropdown();
                    if (allTrades.length > 0 && (!currentTradeId || currentTradeId === '1')) {
                        // Default to the first trade in the list if ID is 1
                        currentTradeId = allTrades[0].id;
                        document.getElementById("trade-select").value = currentTradeId;
                    }
                    loadTradeData(currentTradeId);
                })
                .catch(err => console.error("Failed to load trades list:", err));
        }

        function renderTradeDropdown() {
            const select = document.getElementById("trade-select");
            select.innerHTML = "";

            let filtered = allTrades;
            if (currentFilter === 'losses') {
                filtered = allTrades.filter(t => t.pnl_pct !== null && t.pnl_pct < 0);
            } else if (currentFilter === 'small_gainers') {
                filtered = allTrades.filter(t => t.pnl_pct !== null && t.pnl_pct >= 0 && t.pnl_pct <= 2.0);
            } else if (currentFilter === 'winners') {
                filtered = allTrades.filter(t => t.pnl_pct !== null && t.pnl_pct > 2.0);
            }

            if (filtered.length === 0) {
                filtered = allTrades;
            }

            filtered.forEach(t => {
                const opt = document.createElement("option");
                opt.value = t.id;
                const pnlStr = t.pnl_pct !== null ? `${t.pnl_pct}%` : 'N/A';
                opt.text = `ID ${t.id} | ${t.symbol} (${t.direction || 'BUY'}) | PnL: ${pnlStr}`;
                if(String(t.id) === String(currentTradeId)) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });
        }

        function loadTradeData(tradeId) {
            fetch(`/api/trade_chart_data/${tradeId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById("symbol-title").innerText = "Error: " + data.error;
                        return;
                    }

                    const trade = data.trade || {};
                    const pnlText = trade.pnl_pct !== null ? ` (PnL: ${trade.pnl_pct}%)` : '';
                    document.getElementById("symbol-title").innerText = `${trade.symbol || 'BTCUSDT'} (${trade.direction || 'LONG'})${pnlText}`;

                    const candles = data.candles || [];
                    const formattedCandles = candles.map(c => ({
                        time: c.time,
                        open: c.open,
                        high: c.high,
                        low: c.low,
                        close: c.close
                    }));
                    candlestickSeries.setData(formattedCandles);

                    const volumes = candles.map(c => ({
                        time: c.time,
                        value: c.volume || Math.random() * 1000 + 200,
                        color: c.close >= c.open ? 'rgba(0, 255, 204, 0.5)' : 'rgba(255, 51, 102, 0.5)'
                    }));
                    volumeSeries.setData(volumes);

                    chart.timeScale().fitContent();
                })
                .catch(err => {
                    console.error("Failed to load trade chart data:", err);
                    document.getElementById("symbol-title").innerText = "Error loading chart data";
                });
        }
    </script>
