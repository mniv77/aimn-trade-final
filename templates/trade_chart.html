<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Trade Chart</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>body{margin:0;background:#0b0e14;color:#e5e7eb;font-family:sans-serif} #chart{width:100%;height:85vh} #info{padding:12px;display:flex;gap:16px;align-items:center} .badge{padding:4px 8px;border-radius:4px;background:#1f2937}</style>
</head>
<body>
<div id="info">
<span id="sym" class="badge">Loading...</span>
<span id="pnl" class="badge"></span>
<a href="/" style="color:#60a5fa">← Dashboard</a>
</div>
<div id="chart"></div>
<script>
const urlParams = new URLSearchParams(window.location.search);
const tradeId = urlParams.get('trade_id') || '{{ trade_id|default(1) }}';
const symbolParam = urlParams.get('symbol') || '{{ symbol|default("") }}';
async function load(){
  let tid = tradeId;
  if(symbolParam && (!tid || tid==1)){
    try{
      const listRes = await fetch('/api/trades_list');
      const list = await listRes.json();
      const found = (list.trades||[]).find(t=> t.symbol && t.symbol.toUpperCase().includes(symbolParam.toUpperCase().replace('-','').replace('/','')));
      if(found) tid = found.id;
    }catch(e){}
  }
  const res = await fetch(`/api/trade_chart_data/${tid}`);
  const data = await res.json();
  if(data.error){ document.getElementById('sym').textContent = 'Error '+data.error; return; }
  document.getElementById('sym').textContent = data.symbol + ' ' + data.direction + ' (CB:'+(data.cb_product||'')+')';
  document.getElementById('pnl').textContent = 'PnL '+(data.pnl_pct||0)+'%';
  const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout:{background:{color:'#0b0e14'}, textColor:'#d1d5db'},
    grid:{vertLines:{color:'#1f2937'}, horzLines:{color:'#1f2937'}},
    width: window.innerWidth, height: window.innerHeight*0.85
  });
  const candleSeries = chart.addCandlestickSeries({upColor:'#10b981', downColor:'#ef4444', borderVisible:false, wickUpColor:'#10b981', wickDownColor:'#ef4444'});
  candleSeries.setData(data.candles);
  const markers = (data.markers||[]).map(m=>({time:m.time, position:m.position, color:m.color, shape:m.shape, text:m.text}));
  if(markers.length) candleSeries.setMarkers(markers);
  chart.timeScale().fitContent();
  window.addEventListener('resize', ()=>{ chart.applyOptions({width: window.innerWidth}); });
}
load();
</script>
</body>
</html>
