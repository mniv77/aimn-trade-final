<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trade Review Chart</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background: #0b0e11; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h2 { margin: 0; color: #00ffcc; font-size: 18px; }
        #chart-container { width: 100%; height: 600px; background: #131722; border-radius: 8px; border: 1px solid #2a2e39; }
        .back-btn { background: #20242d; color: #fff; border: 1px solid #2a2e39; padding: 6px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 12px; }
        .back-btn:hover { background: #2a2e39; }
    </style>
</head>
<body>
    <div class="header-bar">
        <h2>Trade Review: <span id="symbol-title">Loading...</span> (ID: {{ trade_id }})</h2>
        <a href="/auto_tuner" class="back-btn">Back to Tuner</a>
    </div>
    <div id="chart-container"></div>
    <script>
        const tradeId = "{{ trade_id }}";
        const chartContainer = document.getElementById("chart-container");
        
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: {
                background: { type: "solid", color: "#131722" },
                textColor: "#d1d4dc",
            },
            grid: {
                vertLines: { color: "#1f293d" },
                horzLines: { color: "#1f293d" },
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
            },
        });
        
        const candlestickSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
            upColor: "#00ffcc", downColor: "#ff4d4d",
            borderUpColor: "#00ffcc", borderDownColor: "#ff4d4d",
            wickUpColor: "#00ffcc", wickDownColor: "#ff4d4d",
        });

        fetch("/api/trade_chart_data/" + tradeId)
            .then(res => res.json())
            .then(data => {
                if(data.error) {
                    document.getElementById("symbol-title").innerText = "Error: " + data.error;
                    return;
                }
                document.getElementById("symbol-title").innerText = data.symbol;
                if (data.candles && data.candles.length > 0) {
                    candlestickSeries.setData(data.candles);
                }
                if (data.markers && data.markers.length > 0) {
                    LightweightCharts.createSeriesMarkers(candlestickSeries, data.markers);
                }
                chart.timeScale().fitContent();
            })
            .catch(err => {
                document.getElementById("symbol-title").innerText = "Error: " + err.message;
            });

        window.addEventListener("resize", () => {
            chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
        });
    </script>
</body>
</html>
