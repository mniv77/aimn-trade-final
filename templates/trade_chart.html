<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trade Review Chart</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background: #0b0e11; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        h2 { margin: 0; color: #00ffcc; font-size: 18px; }
        .controls { display: flex; align-items: center; gap: 10px; font-size: 13px; }
        select { background: #20242d; color: #fff; border: 1px solid #2a2e39; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        select:focus { outline: none; border-color: #00ffcc; }
        #chart-container { width: 100%; height: 600px; background: #131722; border-radius: 8px; border: 1px solid #2a2e39; position: relative; }
        .back-btn { background: #20242d; color: #fff; border: 1px solid #2a2e39; padding: 6px 12px; border-radius: 4px; cursor: pointer; text-decoration: none; font-size: 12px; }
        .back-btn:hover { background: #2a2e39; }
        .filter-btn { background: #20242d; color: #d1d4dc; border: 1px solid #2a2e39; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        .filter-btn:hover, .filter-btn.active { background: #00ffcc; color: #0b0e11; border-color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header-bar">
        <div class="header-left">
            <h2>Trade Review: <span id="symbol-title">Loading...</span></h2>
            <div class="controls">
                <label for="trade-select">Select Trade:</label>
                <select id="trade-select"></select>
                <div class="filter-btns" style="display:inline-flex; gap:5px; margin-left:10px;">
                    <button class="filter-btn active" onclick="setFilter('all', event)">All</button>
                    <button class="filter-btn" onclick="setFilter('losses', event)">Losses</button>
                    <button class="filter-btn" onclick="setFilter('small_gainers', event)">Small Gainers</button>
                    <button class="filter-btn" onclick="setFilter('winners', event)">Winners</button>
                </div>
            </div>
        </div>
        <a href="/auto_tuner" class="back-btn">Back to Tuner</a>
    </div>
    <div id="chart-container"></div>
    <script>
        let currentTradeId = "{{ trade_id }}";
        const chartContainer = document.getElementById("chart-container");
        
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: {
                background: { type: "solid", color: "#131722" },
                textColor: "#d1d4dc",
            },
            grid: {
                vertLines: { color: "#1f293d" },
                horzLines: { color: "#1f293d" },
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
            },
        });
        
        const candlestickSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
            upColor: "#00ffcc", downColor: "#ff4d4d",
            borderUpColor: "#00ffcc", borderDownColor: "#ff4d4d",
            wickUpColor: "#00ffcc", wickDownColor: "#ff4d4d",
        });

        const volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
            color: '#26a69a',
            priceFormat: {
                type: 'volume',
            },
            priceScaleId: '', // set as overlay or separate scale
        });

        volumeSeries.priceScale().applyOptions({
            scaleMargins: {
                top: 0.8, // highest point of volume is at 80% down
                bottom: 0,
            },
        });

        let allTrades = [];
        let currentFilter = 'all';

        function setFilter(type, event) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            }
            renderTradeDropdown(currentFilter);
        }

        function renderTradeDropdown(filterType = 'all') {
            const select = document.getElementById("trade-select");
            select.innerHTML = "";
            
            let filtered = allTrades;
            if (filterType === 'losses') {
                filtered = allTrades.filter(t => t.pnl_pct !== null && t.pnl_pct < 0);
            } else if (filterType === 'small_gainers') {
                filtered = allTrades.filter(t => t.pnl_pct !== null && t.pnl_pct >= 0 && t.pnl_pct <= 2.0);
            } else if (filterType === 'winners') {
                filtered = allTrades.filter(t => t.pnl_pct !== null && t.pnl_pct > 2.0);
            }
            
            if (filtered.length === 0) {
                filtered = allTrades; // Fallback
            }

            filtered.forEach(t => {
                const opt = document.createElement("option");
                opt.value = t.id;
                const pnlStr = t.pnl_pct !== null ? `${t.pnl_pct}%` : 'N/A';
                opt.text = `ID ${t.id} | ${t.symbol} (${t.direction || 'BUY'}) | PnL: ${pnlStr}`;
                if(String(t.id) === String(currentTradeId)) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });
        }

        function loadTradeList() {
            fetch("/api/trades_list")
                .then(res => res.json())
                .then(data => {
                    allTrades = data.trades || [];
                    renderTradeDropdown('all');
                })
                .catch(err => console.error("Failed to load trades list:", err));
        }

        function loadChartData(tId) {
            currentTradeId = tId;
            fetch("/api/trade_chart_data/" + tId)
                .then(res => res.json())
                .then(data => {
                    if(data.error) {
                        document.getElementById("symbol-title").innerText = "Error: " + data.error;
                        return;
                    }
                    const pnlText = data.pnl_pct !== undefined ? ` | PnL: ${data.pnl_pct}%` : '';
                    document.getElementById("symbol-title").innerText = `${data.symbol} (${data.direction || 'TRADE'})${pnlText}`;
                    
                    if (data.candles && data.candles.length > 0) {
                        candlestickSeries.setData(data.candles);
                    }
                    if (data.volumes && data.volumes.length > 0) {
                        volumeSeries.setData(data.volumes);
                    } else if (data.candles && data.candles.length > 0) {
                        // Fallback synthetic volume if backend doesn't provide explicit volume array
                        const dummyVol = data.candles.map(c => ({
                            time: c.time,
                            value: Math.random() * 1000 + 100,
                            color: c.close >= c.open ? 'rgba(0, 255, 204, 0.5)' : 'rgba(255, 77, 77, 0.5)'
                        }));
                        volumeSeries.setData(dummyVol);
                    }
                    if (data.markers && data.markers.length > 0) {
                        LightweightCharts.createSeriesMarkers(candlestickSeries, data.markers);
                    }
                    chart.timeScale().fitContent();
                })
                .catch(err => {
                    document.getElementById("symbol-title").innerText = "Error: " + err.message;
                });
        }

        document.getElementById("trade-select").addEventListener("change", (e) => {
            loadChartData(e.target.value);
        });

        loadTradeList();
        loadChartData(currentTradeId);

        window.addEventListener("resize", () => {
            chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
        });
    </script>
</body>
</html>
