<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiMN — KISS Backtest Control</title>
    <style>
        :root {
            --bg:#080d18; --panel:#0d1526; --border:#1a3050;
            --accent:#2563eb; --accent2:#0ea5e9; --green:#10b981;
            --red:#ef4444; --text:#c8d8f0; --muted:#4a6a90; --label:#7aa0c8;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { background:var(--bg); color:var(--text); font-family:Arial,sans-serif; min-height:100vh; padding:24px; }
        .header { display:flex; align-items:center; gap:12px; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border); }
        .logo { color:var(--accent2); font-family:monospace; font-size:22px; letter-spacing:3px; }
        h1 { color:white; font-size:26px; }
        .header-right { margin-left:auto; display:flex; align-items:center; gap:10px; }
        .badge { color:var(--accent2); border:1px solid var(--border); padding:4px 10px; border-radius:4px; font-family:monospace; font-size:11px; }
        .top-actions { display:flex; justify-content:flex-end; margin-bottom:16px; }
        .top-actions a, .dashboard { padding:8px 16px; border-radius:6px; text-decoration:none; font-weight:bold; }
        .chart-link { background:var(--accent); color:white; border:1px solid #3b82f6; }
        .dashboard { background:var(--panel); color:var(--label); border:1px solid var(--border); }
        .panel { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:18px 20px; margin-bottom:16px; }
        .title { color:var(--muted); font-size:13px; font-weight:bold; letter-spacing:.12em; text-transform:uppercase; margin-bottom:14px; }
        .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
        label { display:block; color:var(--label); font-size:11px; font-weight:bold; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
        select { width:100%; padding:10px 12px; background:#060c18; border:1px solid var(--border); border-radius:4px; color:var(--text); font-family:monospace; font-size:13px; }
        .dir-group { display:flex; gap:8px; }
        .dir-btn { flex:1; padding:10px; background:#060c18; border:1px solid var(--border); border-radius:4px; color:var(--muted); font-weight:bold; cursor:pointer; text-align:center; }
        .dir-btn.active-long { background:#052e16; border-color:var(--green); color:var(--green); }
        .dir-btn.active-short { background:#450a0a; border-color:var(--red); color:var(--red); }
        .actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .feedback-link { display:inline-block; padding:10px 18px; background:#238636; color:white; border-radius:6px; text-decoration:none; font-weight:bold; }
        .hint { color:var(--muted); font-size:12px; }
        @media (max-width:900px) { .grid { grid-template-columns:1fr 1fr; } }
        @media (max-width:600px) { .grid { grid-template-columns:1fr; } .header { flex-wrap:wrap; } .header-right { margin-left:0; width:100%; } }
    </style>
</head>
<body>
    <div class="top-actions">
        <a id="open_chart_link" class="chart-link" href="/tuner_chart" target="_blank">📊 Open Chart &amp; Feedback</a>
    </div>

    <div class="header">
        <div class="logo">AiMN</div>
        <h1>KISS Backtest Control</h1>
        <div class="header-right">
            <span class="badge">TRANSITION STRATEGY</span>
            <a class="dashboard" href="/">← Dashboard</a>
        </div>
    </div>

    <div class="panel">
        <div class="title">🎯 Backtest Target</div>
        <div class="grid">
            <div>
                <label for="broker_select">Broker</label>
                <select id="broker_select" name="broker_id">
                    <option value="">-- Choose --</option>
                    {% for b in brokers %}
                        <option value="{{ b.id }}">{{ b.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="symbol_select">Symbol</label>
                <select id="symbol_select" disabled>
                    <option value="">-- Choose Broker First --</option>
                </select>
            </div>
            <div>
                <label>Direction</label>
                <div class="dir-group">
                    <div class="dir-btn" id="btn_long" onclick="setDirection('LONG')">LONG</div>
                    <div class="dir-btn" id="btn_short" onclick="setDirection('SHORT')">SHORT</div>
                </div>
            </div>
            <div>
                <label for="timeframe_select">Timeframe</label>
                <select id="timeframe_select">
                    <option value="5m">5m</option>
                    <option value="15m">15m</option>
                    <option value="30m">30m</option>
                    <option value="1hr" selected>1hr</option>
                    <option value="6hr">6hr</option>
                </select>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="title">▶ KISS Backtest</div>
        <div id="kiss_button_anchor" class="actions"></div>
        <p class="hint" style="margin-top:10px;">Uses the selected broker, symbol, direction and timeframe. The KISS backtest is independent of the retired Auto Tuner.</p>
    </div>

    <div class="panel">
        <div class="title">📈 Review</div>
        <a class="feedback-link" href="/tuner_chart" target="_blank">📈 Open Feedback Chart (Working)</a>
    </div>

<script>
let direction = null;
const brokerSelect = document.getElementById('broker_select');
const symbolSelect = document.getElementById('symbol_select');

function setDirection(dir) {
    direction = dir;
    document.getElementById('btn_long').className = 'dir-btn' + (dir === 'LONG' ? ' active-long' : '');
    document.getElementById('btn_short').className = 'dir-btn' + (dir === 'SHORT' ? ' active-short' : '');
}

brokerSelect.addEventListener('change', function() {
    const brokerId = this.value;
    if (!brokerId) {
        symbolSelect.disabled = true;
        symbolSelect.innerHTML = '<option value="">-- Choose Broker First --</option>';
        return;
    }
    symbolSelect.disabled = true;
    symbolSelect.innerHTML = '<option value="">-- Loading Symbols --</option>';
    fetch('/get_symbols?broker_id=' + encodeURIComponent(brokerId))
        .then(r => r.json())
        .then(data => {
            const symbols = Array.isArray(data) ? data : (data.symbols || data.data || []);
            symbolSelect.innerHTML = '<option value="">-- Choose Symbol --</option>';
            symbols.forEach(sym => {
                const value = (typeof sym === 'object' && sym !== null) ? (sym.symbol || sym.name || sym.ticker) : sym;
                if (value) {
                    const option = document.createElement('option');
                    option.value = value;
                    option.textContent = value;
                    symbolSelect.appendChild(option);
                }
            });
            symbolSelect.disabled = false;
            updateChartLink();
        })
        .catch(() => {
            symbolSelect.innerHTML = '<option value="">-- Error Loading Symbols --</option>';
            symbolSelect.disabled = true;
        });
});

symbolSelect.addEventListener('change', updateChartLink);

async function updateChartLink() {
    const sym = (symbolSelect.value || '').toUpperCase();
    const chartLink = document.getElementById('open_chart_link');
    if (!sym) { chartLink.href = '/tuner_chart'; return; }
    try {
        const r = await fetch('/api/trades_list');
        const j = await r.json();
        const trade = (j.trades || []).find(t => (t.symbol || '').toUpperCase() === sym);
        chartLink.href = trade ? `/tuner_chart?trade_id=${encodeURIComponent(trade.id)}` : '/tuner_chart';
    } catch (e) {
        chartLink.href = '/tuner_chart';
    }
}

window.__aimnKissDirection = function() { return direction || 'LONG'; };
</script>
</body>
</html>
