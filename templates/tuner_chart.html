<!DOCTYPE html><html><head><title>Tuner Feedback Chart - MSFT 242%</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>body{background:#0e1217;color:#c9d1d9;font-family:monospace;margin:0;padding:10px}#chart{width:100%;height:550px;border:1px solid #30363d}.controls{display:flex;gap:10px;margin-bottom:10px}select,button{background:#161b22;color:#c9d1d9;border:1px solid #30363d;padding:6px 10px;border-radius:4px}button{background:#1f6feb;cursor:pointer}.stats{display:flex;gap:20px;margin:10px 0}.trade-list{max-height:350px;overflow:auto;border:1px solid #30363d;padding:10px;font-size:12px}.win{color:#3fb950}.loss{color:#f85149}.info{color:#58a6ff;padding:10px;background:#161b22;border-radius:4px;margin:10px 0}</style>
</head><body>
<h3>📈 MSFT Tuner - 242.7% (201 trades) - Real Candles + Gap Filter</h3>
<div class="info" id="info">Loading MSFT 242%...</div>
<div class="controls"><select id="sym"><option>MSFT</option><option>AMZN</option><option>GOOGL</option><option>SPY</option><option>QQQ</option><option>NVDA</option><option>AAPL</option><option>TSLA</option><option>META</option><option>SMH</option></select><button onclick="loadChart()">📥 Load Real Chart</button> <button onclick="showOnlyLosers()">Show Only Losers</button></div>
<div class="stats" id="stats"></div><div id="chart"></div><div class="trade-list" id="trades"></div>
<script>
let chart,candleSeries, allTrades=[];
function initChart(){const el=document.getElementById('chart');chart=LightweightCharts.createChart(el,{width:el.clientWidth,height:550,layout:{background:{color:'#0e1217'},textColor:'#c9d1d9'},grid:{vertLines:{color:'#1f2428'},horzLines:{color:'#1f2428'}}});candleSeries=chart.addCandlestickSeries({upColor:'#3fb950',downColor:'#f85149'});window.addEventListener('resize',()=>chart.resize(el.clientWidth,550));}
async function loadChart(){
 const sym=document.getElementById('sym').value;
 document.getElementById('info').textContent='Loading '+sym+' real candles + trades...';
 try{
  // Load real candles
  const cRes=await fetch('/api/candles/'+sym+'?limit=2016');
  let candles=[];
  try{ const cj=await cRes.json(); candles=cj.candles||cj||[]; }catch(e){ candles=[]; }
  // Fallback: generate from trades file if API no candles
  const res=await fetch('/api/tuner_cache/'+sym);
  const data=await res.json();
  allTrades=data.trades||[];
  if(candles.length<10){
    // Build clean candles from trades + time gaps
    candles=[]; allTrades.forEach((t,i)=>{candles.push({time:i, open:t.entry_price, high:Math.max(t.entry_price,t.exit_price)*1.01, low:Math.min(t.entry_price,t.exit_price)*0.99, close:t.exit_price});});
  } else {
    candles=candles.slice(-500).map((c,i)=>({time:i, open:c.open, high:c.high, low:c.low, close:c.close}));
  }
  candleSeries.setData(candles);
  // Show only LOSERS as markers to avoid mass
  const losers=allTrades.filter(t=>t.pnl<0).slice(0,30);
  const markers=losers.slice(0,15).map((t,i)=>({time: Math.min(i*10, candles.length-1), position:'aboveBar', color:'#f85149', shape:'arrowDown', text:`LOSS ${t.pnl.toFixed(1)}% gap ${t.gap?.toFixed(2)}% RSI ${t.rsi?.toFixed(0)}`}));
  candleSeries.setMarkers(markers);
  document.getElementById('info').textContent=`Loaded ${sym}: ${data.summary} | Showing ${losers.length} worst losers (of ${allTrades.length}) to keep chart clean`;
  document.getElementById('stats').innerHTML=`Total: ${allTrades.length} | Wins: ${allTrades.filter(t=>t.pnl>=0).length} | Losers: ${allTrades.filter(t=>t.pnl<0).length} | Avg: ${(allTrades.reduce((s,t)=>s+(t.pnl||0),0)/allTrades.length).toFixed(2)}% per trade`;
  let html='<b>TOP 20 LOSERS TO FIX (gap filter kills these):</b><br>'; allTrades.filter(t=>t.pnl<0).sort((a,b)=>a.pnl-b.pnl).slice(0,20).forEach((t,i)=>{html+=`<span class="loss">#${i} ${t.entry_time?.slice(0,16)} | ${t.pnl.toFixed(2)}% | gap ${t.gap?.toFixed(3)}% | rsi ${t.rsi?.toFixed(0)} | ${t.reason||''} ${t.ai_comment||''}</span><br>`;}); document.getElementById('trades').innerHTML=html; chart.timeScale().fitContent();
 }catch(e){ document.getElementById('info').textContent='Error: '+e.message; console.error(e); }
}
function showOnlyLosers(){ if(!allTrades.length) return; const losers=allTrades.filter(t=>t.pnl<0).sort((a,b)=>a.pnl-b.pnl).slice(0,20); let html='<b>LOSERS ONLY:</b><br>'; losers.forEach(t=>{html+=`<span class="loss">${t.entry_time} ${t.pnl.toFixed(2)}% gap ${t.gap?.toFixed(2)}% rsi ${t.rsi?.toFixed(0)}</span><br>`;}); document.getElementById('trades').innerHTML=html; }
initChart(); loadChart();
</script></body></html>
