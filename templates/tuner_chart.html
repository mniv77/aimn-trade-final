<!DOCTYPE html>
<html><head><title>Tuner Feedback Chart - Last Result</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>body{background:#0e1217;color:#c9d1d9;font-family:monospace;margin:0;padding:10px}#chart{width:100%;height:600px;border:1px solid #30363d}.controls{display:flex;gap:10px;margin-bottom:10px}select,button{background:#161b22;color:#c9d1d9;border:1px solid #30363d;padding:6px 10px;border-radius:4px}button{background:#1f6feb;cursor:pointer}.stats{display:flex;gap:20px;margin:10px 0}.trade-list{max-height:400px;overflow:auto;border:1px solid #30363d;padding:10px;font-size:12px}.win{color:#3fb950}.loss{color:#f85149}.info{color:#58a6ff;padding:10px;background:#161b22;border-radius:4px;margin:10px 0}</style>
</head><body>
<h3>📈 Tuner Result Chart - Last Run (140 trades)</h3>
<div class="info" id="info">Loading last tuner result from localStorage... Run Auto Tuner first, then click here.</div>
<div class="controls"><button onclick="loadFromTuner()">📥 Load Last Tuner Result (113% SPY)</button> <button onclick="loadFromAPI()">🔄 Load Fresh from API</button></div>
<div class="stats" id="stats"></div><div id="chart"></div><div class="trade-list" id="trades"></div>
<script>
let chart,candleSeries;
function initChart(){const el=document.getElementById('chart');chart=LightweightCharts.createChart(el,{width:el.clientWidth,height:600,layout:{background:{color:'#0e1217'},textColor:'#c9d1d9'},grid:{vertLines:{color:'#1f2428'},horzLines:{color:'#1f2428'}}});candleSeries=chart.addCandlestickSeries({upColor:'#3fb950',downColor:'#f85149'});window.addEventListener('resize',()=>chart.resize(el.clientWidth,600));}
async function loadFromTuner(){
 const raw=localStorage.getItem('last_tuner_result'); if(!raw){document.getElementById('info').textContent='No saved tuner result! Go to /auto_tuner and RUN AUTO TUNER first, then come back.'; return;}
 const data=JSON.parse(raw); document.getElementById('info').textContent=`Loaded: ${data.symbol} ${data.total_pnl_val?.toFixed(1)}% | ${data.trades_val||data.trades?.length} trades | WR ${data.win_rate_val}%`;
 if(!data.trades || data.trades.length==0){document.getElementById('info').textContent+=' - No trades array! Need to save trades in auto_tuner JS'; return;}
 // Build fake candles from trades for visualization (since we have entry/exit)
 const candles=[]; data.trades.forEach((t,i)=>{candles.push({time:i*2,open:t.entry_price,high:Math.max(t.entry_price,t.exit_price)*1.005,low:Math.min(t.entry_price,t.exit_price)*0.995,close:t.exit_price});});
 candleSeries.setData(candles);
 const markers=[]; data.trades.forEach((t,i)=>{const isLoss=t.pnl<0; markers.push({time:i*2,position:isLoss?'aboveBar':'aboveBar',color:isLoss?'#f85149':'#3fb950',shape:isLoss?'arrowDown':'arrowDown',text:`${isLoss?'LOSER '+t.pnl.toFixed(2)+'%':'WIN '+t.pnl.toFixed(2)+'%'} ${t.reason||''}`});}); candleSeries.setMarkers(markers);
 document.getElementById('stats').innerHTML=`Total: ${data.trades.length} | Losers: ${data.trades.filter(t=>t.pnl<0).length} | Avg Loser: ${(data.trades.filter(t=>t.pnl<0).reduce((s,t)=>s+t.pnl,0)/Math.max(1,data.trades.filter(t=>t.pnl<0).length)).toFixed(2)}%`;
 let html='<b>LOSERS FIRST (to fix):</b><br>'; data.trades.filter(t=>t.pnl<0).sort((a,b)=>a.pnl-b.pnl).forEach((t,i)=>{html+=`<span class="loss">#${i} ${t.entry_time} | Entry ${t.entry_price.toFixed(2)} -> Exit ${t.exit_price.toFixed(2)} | ${t.pnl.toFixed(3)}% | gap ${t.gap?.toFixed(3)}% | RSI ${t.rsi?.toFixed(1)} | Reason: ${t.reason} | ${t.ai_comment||''}</span><br>`;}); html+='<br><b>WINNERS:</b><br>'; data.trades.filter(t=>t.pnl>=0).forEach((t,i)=>{html+=`<span class="win">#${i} +${t.pnl.toFixed(3)}% gap ${t.gap?.toFixed(2)}%</span><br>`;}); document.getElementById('trades').innerHTML=html; chart.timeScale().fitContent();
}
async function loadFromAPI(){ /* your old API logic */ const res=await fetch(`/api/tuner_chart/SPY/LONG/30m`); const data=await res.json(); console.log(data); }
initChart(); loadFromTuner();
</script></body></html>
