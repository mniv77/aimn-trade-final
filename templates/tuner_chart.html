<!DOCTYPE html><html><head><title>Tuner Feedback Chart - Last Result</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>body{background:#0e1217;color:#c9d1d9;font-family:monospace;margin:0;padding:10px}#chart{width:100%;height:600px;border:1px solid #30363d}.controls{display:flex;gap:10px;margin-bottom:10px}select,button{background:#161b22;color:#c9d1d9;border:1px solid #30363d;padding:6px 10px;border-radius:4px}button{background:#1f6feb;cursor:pointer}.stats{display:flex;gap:20px;margin:10px 0}.trade-list{max-height:400px;overflow:auto;border:1px solid #30363d;padding:10px;font-size:12px}.win{color:#3fb950}.loss{color:#f85149}.info{color:#58a6ff;padding:10px;background:#161b22;border-radius:4px;margin:10px 0}</style>
</head><body>
<h3>📈 Tuner Result Chart - MSFT 99% (22 trades)</h3>
<div class="info" id="info">Loading...</div>
<div class="controls"><select id="sym"><option>MSFT</option><option>AMZN</option><option>GOOGL</option><option>SPY</option><option>QQQ</option><option>NVDA</option><option>AAPL</option><option>TSLA</option><option>META</option><option>SMH</option></select><button onclick="loadFromTuner()">📥 Load</button></div>
<div class="stats" id="stats"></div><div id="chart"></div><div class="trade-list" id="trades"></div>
<script>
let chart,candleSeries;
function initChart(){const el=document.getElementById('chart');chart=LightweightCharts.createChart(el,{width:el.clientWidth,height:600,layout:{background:{color:'#0e1217'},textColor:'#c9d1d9'},grid:{vertLines:{color:'#1f2428'},horzLines:{color:'#1f2428'}}});candleSeries=chart.addCandlestickSeries({upColor:'#3fb950',downColor:'#f85149'});window.addEventListener('resize',()=>chart.resize(el.clientWidth,600));}
async function loadFromTuner(){
 const sym=document.getElementById('sym').value;
 document.getElementById('info').textContent='Loading '+sym+'...';
 try{
  const res=await fetch('/api/tuner_cache/'+sym);
  if(!res.ok) throw new Error('no cache');
  const data=await res.json();
  const trades=data.trades||[];
  document.getElementById('info').textContent=`Loaded: ${sym} | ${data.summary} | ${trades.length} trades`;
  const candles=[]; trades.forEach((t,i)=>{candles.push({time:i*2,open:t.entry_price,high:Math.max(t.entry_price,t.exit_price)*1.005,low:Math.min(t.entry_price,t.exit_price)*0.995,close:t.exit_price});});
  candleSeries.setData(candles);
  const markers=[]; trades.forEach((t,i)=>{const isLoss=t.pnl<0; markers.push({time:i*2,position:isLoss?'aboveBar':'belowBar',color:isLoss?'#f85149':'#3fb950',shape:isLoss?'arrowDown':'arrowUp',text:`${isLoss?'LOSER '+t.pnl.toFixed(2)+'%':'WIN '+t.pnl.toFixed(2)+'%'} gap ${t.gap?.toFixed(2)}% RSI ${t.rsi?.toFixed(0)}`});}); candleSeries.setMarkers(markers);
  document.getElementById('stats').innerHTML=`Total: ${trades.length} | Wins: ${trades.filter(t=>t.pnl>=0).length} | Losers: ${trades.filter(t=>t.pnl<0).length}`;
  let html='<b>LOSERS (fix these):</b><br>'; trades.filter(t=>t.pnl<0).sort((a,b)=>a.pnl-b.pnl).forEach((t,i)=>{html+=`<span class="loss">#${i} ${t.entry_time} ${t.pnl.toFixed(3)}% gap ${t.gap?.toFixed(3)}% rsi ${t.rsi?.toFixed(0)} ${t.reason}</span><br>`;}); html+='<br><b>WINNERS:</b><br>'; trades.filter(t=>t.pnl>=0).forEach((t)=>{html+=`<span class="win">+${t.pnl.toFixed(3)}% gap ${t.gap?.toFixed(2)}% rsi ${t.rsi?.toFixed(0)}</span><br>`;}); document.getElementById('trades').innerHTML=html; chart.timeScale().fitContent();
 }catch(e){ document.getElementById('info').textContent='Error: '+e.message+' - Run python engine/tuner_perfect_v3.py --symbol '+sym+' first'; console.error(e); }
}
initChart(); loadFromTuner();
</script></body></html>
